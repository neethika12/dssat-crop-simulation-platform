[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dssat-validator"
version = "0.1.0"
description = "Validation and automated calibration framework for the DSSAT crop simulation model"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dssat_validator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
